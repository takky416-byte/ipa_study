<script>
/*
 * 応用情報技術者試験 科目B CBT模擬試験（GAS版・学生画面）
 * 画面構成・操作は CBT-Solutions 公開の「科目B群 試験当日の試験アプリ 操作方法のご案内」に合わせている。
 * 解答は端末にも控えを残しつつ、一定間隔でサーバー（受験記録シート）に保存する。
 */
(function () {
  "use strict";

  // ======================================================================
  // ユーティリティ
  // ======================================================================
  function $(sel, r) { return (r || document).querySelector(sel); }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else if (k === "style") e.style.cssText = v;
      else e.setAttribute(k, v === true ? "" : v);
    }
    (children || []).forEach(function (c) {
      if (c == null || c === false) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }
  function store(key, val) {
    try {
      if (val === undefined) { var s = localStorage.getItem(key); return s ? JSON.parse(s) : null; }
      if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { return null; }
  }
  function chars(s) { return Array.from(s || "").length; }
  function cut(s, n) { return Array.from(s || "").slice(0, n).join(""); }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function toHalf(s) { return String(s || "").replace(/[０-９Ａ-Ｚａ-ｚ（）]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); }

  /** google.script.run を Promise で呼ぶ */
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[name].apply(r, args);
    });
  }

  var root = document.getElementById("root");
  var PORTAL = null;            // getPortalData の結果
  var EXAM = null, PROBS = [], SESSION = null, STUDENT = null;
  var S = null;                 // 受験中の状態 { selected, answers, flags, memo, cur, leaveCount }
  var clockOffset = 0;          // サーバー時刻 - 端末時刻
  var clip = "";

  // ======================================================================
  // 小問マスタ → CBT の解答欄
  // ======================================================================
  function splitLabel(s) {
    s = toHalf(s).trim();
    var m = s.match(/^(設問\s*\d+\s*(?:\(\d+\))?)\s*(.*)$/);
    if (!m) return { label: s, key: "" };
    return { label: m[1].replace(/\s+/g, ""), key: m[2].trim() };
  }
  function toField(sq, key) {
    var t = sq.type, lim = String(sq.limit || "").trim();
    var f = { sid: sq.sub_q_id, key: key };
    if (t === "選択") {
      f.type = key ? "pulldown" : "choice";
      f.options = lim ? lim.split(/[,，、]/).map(function (x) { return x.trim(); }).filter(String) : ["ア", "イ", "ウ", "エ"];
    } else if (t === "多答") {
      f.type = "multi";
      var m = lim.match(/^(\d+)\s*[:：]\s*(.*)$/);
      if (m) { f.limit = parseInt(m[1], 10); lim = m[2]; }
      f.options = lim ? lim.split(/[,，、]/).map(function (x) { return x.trim(); }).filter(String) : ["ア", "イ", "ウ", "エ"];
    } else if (t === "図表") {
      f.type = "none";
      f.text = "（図表で解答する設問のため、解答入力欄はありません）";
    } else if (t === "記述" && /^[（(]/.test(lim)) {
      f.type = "none";
      f.text = lim;
    } else {
      var n = parseInt(toHalf(lim), 10) || 0;
      if (t === "記述" && n > 15) { f.type = "text"; f.max = n; }
      else { f.type = "line"; f.max = n || 60; }
    }
    return f;
  }
  function buildProblems(exam) {
    var man = window.CBT_IMG_MANIFEST || {};
    var base = (PORTAL && PORTAL.imageBase) || "";
    return exam.questions.map(function (q, i) {
      var items = [], byLabel = {};
      q.subQuestions.forEach(function (sq) {
        var p = splitLabel(sq.sub_q_number);
        var it = byLabel[p.label];
        if (!it) { it = byLabel[p.label] = { label: p.label, fields: [] }; items.push(it); }
        it.fields.push(toField(sq, p.key));
      });
      var n = man[q.questionId] || 0, pages = null;
      var txt = (window.CBT_TEXT || {})[q.questionId];
      if (txt && base) pages = txt.map(function (h, k) { return { html: h.replace(/\{BASE\}/g, base), text: true, no: k + 1 }; });
      else if (n && base) { pages = []; for (var k = 1; k <= n; k++) pages.push(base + q.questionId + "/" + k + ".png"); }
      return { idx: i, qid: q.questionId, label: q.qNumber, title: q.category || "", theme: q.theme || "",
        source: q.source || "", required: q.required, pdfId: q.pdfId, pages: pages, items: items };
    });
  }
  function tutorialProblems() {
    var P = [];
    P.push('<h2 class="tt2">試験画面の構成</h2><ul>' +
      '<li>試験名が画面上部の中央に表示されます。その下に「○ページ中○ページ目」が表示されます。</li>' +
      '<li>画面右上に、残り時間と「問題選択」「メモ」「参考資料（注意事項）」「試験終了」ボタンが表示されます。試験ごとの参考資料がある場合は「参考資料」、ない場合は「注意事項」のボタンが表示され、押すと参考資料や注意事項を確認できます。</li>' +
      '<li>画面の左側に問題文が、右側に解答欄が表示されます。左の選択肢を見て、右の解答欄で解答を選択します。選択するとボタンの色が変わり、再度選択すると未解答に戻ります。</li>' +
      '<li>画面下部の「解答状況」で解答状況一覧の表示／非表示を切り替えられます。「電卓」で電卓が、「問題（別画面）」で問題が別の画面に表示されます。</li>' +
      '<li>「後で見直す」を押すと、解答状況一覧で「後で見直すもの」として表示されます。「前の問題」で1つ前の問題へ戻り、「次の問題」で次の問題へ進みます。</li></ul>');
    P.push('<h2 class="tt2">白黒反転について</h2><p>試験開始前及び試験中に，白黒反転の切り替えボタンが，画面右上に表示されます。</p>' +
      '<p>切り替えボタンを押すと，白黒反転表示に切り替わります。白黒反転表示の状態で再度ボタンを押すと，非反転表示に戻ります。</p>' +
      '<p class="tt-try">画面右上の「白黒反転」を押して，表示を切り替えてみましょう。</p>');
    P.push('<h2 class="tt2">拡大・縮小について</h2><p>問題文の上のスライダーを左右に動かすことで，試験問題の拡大・縮小ができます。</p>' +
      '<p>左右の枠の境目を動かすことで，左右の画面の表示割合を変更できます。</p>' +
      '<p>参考資料の画面でも，スライダーを左右に動かすことで参考資料の拡大・縮小ができます。</p>' +
      '<p class="tt-try">スライダーや枠の境目を動かしてみましょう。</p>');
    P.push('<h2 class="tt2">電卓について</h2><p>電卓ボタンを押すと画面上に電卓が表示されます。閉じる場合は再度電卓ボタンを押してください。電卓のサイズは右上の「小・中・大」ボタンで変更できます。</p>' +
      '<h2 class="tt2">メモについて</h2><p>メモボタンを押すと画面上にメモが表示されます。</p><ul>' +
      '<li>メモを半透明にし，下の問題が透けて見えるようにします。</li>' +
      '<li>文字にマーカーを引くことができます。マーカーは赤，青，黄色があります。白はマーカーを消します。また，メモ内容は試験が終了するまで保持されます。</li>' +
      '<li>入力方式を変更できます。変更した入力方式はメモ及び解答欄にも適用されます。</li>' +
      '<li>メモの入力内容を検索できます。</li></ul>');
    P.push('<h2 class="tt2">問題選択について</h2><p>問題選択が必要な科目においては，試験開始時に問題選択のウィンドウが表示されます。<span class="red">採点は選択された問題のみとなりますので，試験終了までに問題を選択してください。</span>必須の問題がある場合にはすでに選択された状態です。</p>' +
      '<p>選択が必要な問題数が表示されていますので，必要数を選択してください。問題選択ボタンを押すことで再度問題選択のウィンドウを出すことができます。</p>' +
      '<p class="red">選択後必ず選択ボタンを押してください。選択ボタンを押さないで試験終了した場合，画面上で問題を選択していても選択問題として反映されません。</p>' +
      '<p>試験終了ボタンを押した時点で，選択が必要な問題数が不足している場合は，アラートが表示されます。「はい」を押すと試験終了へ進み，「いいえ」を押すと試験画面へ戻ります。</p>' +
      '<p>必要選択数を超えている場合には，メッセージが表示されます。正しく選択しなおしてください。</p>');
    P.push('<h2 class="tt2">問題（別画面）について</h2><p>問題（別画面）ボタンを押すと，別ウィンドウで同じ問題が表示されます。問題文の上部と下部を同時に確認したり，問題文と図を同時に確認する場合にご利用ください。モニター上での移動やサイズ変更が可能です。マーカー機能も使用可能です。</p>' +
      '<p class="tt-try">画面下部の「問題（別画面）」を押してみましょう。</p>');
    P.push('<h2 class="tt2">マーカーについて</h2><p>マウス操作によって，問題に直接書き込むことができます。書き込みした内容は試験が終了するまで保持されます。</p><ul>' +
      '<li>矢印のボタンで通常モードにします。</li><li>赤・青・黄のボタンでマーカーモードにし，マーカーの色を選択できます。</li>' +
      '<li>消しゴムのボタンで消しゴムモードにします。消しゴムでマーカーを消すことができます。</li>' +
      '<li>「サイズ」のスライドでマーカーの太さを選択できます。「クリア」で書き込みしたものを一括で消すことができます。</li></ul>' +
      '<h2 class="tt2">チェックボックス，プルダウンについて</h2><p>選択肢の中から，該当するものを選択してください。</p>' +
      '<h2 class="tt2">記述式解答欄について</h2><p>記述式解答欄は次の２種類があります。キーボードでの入力，及び「コピー」等の編集機能を使用して解答してください。試験中に文字入力方式を変更するときは，画面右上のメモボタンを押してメモを起動し，メモ画面右上の「ローマ字／かな」で変更してください。</p>' +
      '<p>①解答欄が1行のもの：設問内容によっては，文字の入力制限（字数・英数字など）があります。</p>' +
      '<p>②解答欄が複数行のもの：文字を選択した状態でボタンを押すと「カット」「コピー」が可能です。メモや他の解答欄にも「ペースト」で貼り付けが可能です。なお，これらのボタンがない解答欄には「ペースト」できません。検索ボタンを押すと，下部に検索ボックスが表示されますので単語を入力してください。検索でヒットした場合は黄色でハイライトされます。文字数の入力制限がある場合は右下に表示されます。制限数以上の入力をした場合，最大数に合わせて削除されます。右下をドラッグすると入力欄を広げることができます。</p>');
    P.push('<p>操作確認用のサンプル問題です。解答の操作をしてみましょう。</p><p class="tt-gap">チュートリアルはこのページで終了です。<br>&nbsp;本試験に進む場合は，画面右上の「確認終了」ボタンを押してチュートリアルを終了してください。<br>チュートリアルを終了するとチュートリアル終了画面が表示されます。</p>' +
      '<p class="tt-gap"><b>設問 1</b>　選択による解答です。</p><p>下記の[ a ]に入る値を選択しなさい。</p><p>1 ＋ 1 ＝ [ a ]</p><p>ア　1　　　　　イ　2　　　　　ウ　3　　　　　エ　4</p>' +
      '<p class="tt-gap"><b>設問 2</b>　チェックボックスによる解答です。</p><p>計算結果が「2」になるものをすべて選択しなさい。</p><p>ア　1＋1　　　イ　2×2　　　ウ　4÷2　　　エ　2－1</p>' +
      '<p class="tt-gap"><b>設問 3</b>　リスト（プルダウン）による解答です。</p><p>下記の[ a ]に入る値を選択しなさい。</p><p>1 ＋ 1 ＝ [ a ]</p>' +
      '<p class="tt-gap"><b>設問 4</b>　単語（短文）入力による解答です。</p><p>以下の[ a ]に入る値を入力しなさい。</p><p>税率が10%の場合，500円の税込み価格は[ a ]円です。</p>' +
      '<p class="tt-gap"><b>設問 5</b>　記述（論述）入力による解答です。</p><p>長文の入力ができます。<br>ご自由に入力してお試しください。</p>');
    var Z = "０１２３４５６７８";
    function f(sid, type, extra) { var o = { sid: sid, key: "", type: type }; for (var k in extra) o[k] = extra[k]; return o; }
    return P.map(function (html, i) {
      var page = { idx: i, qid: "tut" + (i + 1), label: (i + 1) + "ページ目", title: "", pages: [{ html: html }], items: [{ label: Z.charAt(i + 1) + "ページ目", fields: [] }] };
      if (i === 7) page.items = [
        { label: "設問1", fields: [f("t1", "choice", { options: ["ア", "イ", "ウ", "エ"] })] },
        { label: "設問2", fields: [f("t2", "multi", { options: ["ア", "イ", "ウ", "エ"] })] },
        { label: "設問3", fields: [f("t3", "pulldown", { options: ["1", "2", "3", "4"] })] },
        { label: "設問4", fields: [f("t4", "line", { max: 10 })] },
        { label: "設問5", fields: [f("t5", "text", { max: 100 })] }
      ];
      return page;
    });
  }

  function referencePages() {
    var man = window.CBT_IMG_MANIFEST || {}, base = (PORTAL && PORTAL.imageBase) || "";
    for (var i = 0; i < PROBS.length; i++) {
      var id = PROBS[i].qid.replace(/_pm\d+$/, "_ref");
      if (man[id] && base) { var a = []; for (var k = 1; k <= man[id]; k++) a.push(base + id + "/" + k + ".png"); return a; }
    }
    return null;
  }
  /** 問題文の文字データ（img/大問ID/text.js）を読み込む。ない大問は画像で表示する */
  function loadTexts(exam, cb) {
    var base = PORTAL.imageBase, left = 0, done = false;
    if (!base) { cb(); return; }
    window.CBT_TEXT = window.CBT_TEXT || {};
    function fin() { if (!done && --left <= 0) { done = true; cb(); } }
    exam.questions.forEach(function (q) {
      if (window.CBT_TEXT[q.questionId]) return;
      left++;
      var s = document.createElement("script");
      s.src = base + q.questionId + "/text.js";
      s.onload = fin; s.onerror = fin;
      document.head.appendChild(s);
    });
    if (!left) { done = true; cb(); }
    setTimeout(function () { if (!done) { done = true; cb(); } }, 8000);
  }
  /** 問題文のフォント（IPAゴシック。問題冊子と同じ字形） */
  function loadFont() {
    if (!PORTAL.imageBase || document.getElementById("qfont")) return;
    var st = document.createElement("style"); st.id = "qfont";
    st.textContent = '@font-face{font-family:"IPAGothicCBT";src:url("' + PORTAL.imageBase + '../font/ipag.ttf") format("truetype");font-display:block;}';
    document.head.appendChild(st);
  }
  function loadManifest(cb) {
    loadFont();
    if (!PORTAL.imageBase || window.CBT_IMG_MANIFEST) { cb(); return; }
    var s = document.createElement("script");
    s.src = PORTAL.imageBase + "manifest.js";
    s.onload = cb; s.onerror = cb;
    document.head.appendChild(s);
  }

  // ======================================================================
  // キー操作によるコピー・貼り付けの禁止（本番仕様）
  // ======================================================================
  function inExam() { return document.body.classList.contains("in-exam"); }
  ["copy", "cut", "paste", "drop", "dragstart", "contextmenu"].forEach(function (t) {
    document.addEventListener(t, function (e) { if (inExam()) e.preventDefault(); }, true);
  });
  document.addEventListener("keydown", function (e) {
    if (!inExam()) return;
    var k = (e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ["c", "x", "v", "p", "s", "f", "u", "a"].indexOf(k) >= 0 && !(k === "a" && /^(INPUT|TEXTAREA)$/.test(e.target.tagName))) e.preventDefault();
    if (k === "f5" || k === "f12" || ((e.ctrlKey || e.metaKey) && k === "r")) e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i", "j", "c"].indexOf(k) >= 0) e.preventDefault();
  }, true);
  window.addEventListener("beforeunload", function (e) { if (inExam()) { e.preventDefault(); e.returnValue = ""; } });

  // 画面離脱（別のタブ・ウィンドウへの切り替え、全画面の解除）を数える
  document.addEventListener("visibilitychange", function () { if (inExam() && document.hidden) noteLeave(); });
  document.addEventListener("fullscreenchange", function () { if (inExam() && !document.fullscreenElement) noteLeave(); });
  var lastLeave = 0;
  function noteLeave() {
    if (Date.now() - lastLeave < 1500) return;
    lastLeave = Date.now();
    S.leaveCount = (S.leaveCount || 0) + 1;
    markDirty();
  }

  // ======================================================================
  // 画面: 試験一覧（ポータル）
  // ======================================================================
  var CREDS = null;      // ログイン画面で入力したユーザーID・パスワード
  var TUTORIAL = false;  // 受験者向けチュートリアル中
  var IME = "romaji";

  function boot() {
    root.innerHTML = '<div class="loading">読み込み中...</div>';
    api("getPortalData", CREDS).then(function (d) {
      PORTAL = d;
      if (d.loginRequired && !CREDS) { renderLogin(); return; }
      loadManifest(renderPortal);
    }).catch(function (err) {
      root.innerHTML = "";
      root.appendChild(el("div", { class: "loading", text: "読み込みに失敗しました。ページを再読み込みしてください。（" + (err.message || err) + "）" }));
    });
  }

  // ---------------------------------------------------------------------
  // ログイン画面（本番：ログイン情報シートのユーザーID・パスワードを入力して「Log in」）
  // ---------------------------------------------------------------------
  function renderLogin(errMsg) {
    document.body.classList.remove("in-exam");
    root.innerHTML = "";
    var uid = el("input", { type: "text", class: "lg-input", autocomplete: "off", spellcheck: "false" });
    var pw = el("input", { type: "password", class: "lg-input", autocomplete: "off" });
    var btn = el("button", { class: "lg-btn", text: "Log in", disabled: true });
    function upd() { btn.disabled = !(uid.value.trim() && pw.value); }
    uid.addEventListener("input", upd); pw.addEventListener("input", upd);
    pw.addEventListener("keydown", function (e) { if (e.key === "Enter" && !btn.disabled) btn.click(); });
    var msg = el("div", { class: "lg-err", text: errMsg || "" });
    btn.addEventListener("click", function () {
      btn.disabled = true; msg.textContent = "";
      api("login", uid.value.trim(), pw.value).then(function (r) {
        nameConfirm(r, function () { CREDS = { userId: uid.value.trim(), password: pw.value }; boot(); }, function () { pw.value = ""; upd(); });
      }).catch(function (err) { msg.textContent = String(err.message || err); upd(); });
    });
    root.appendChild(el("div", { class: "lg-wrap" }, [
      el("div", { class: "lg-card" }, [
        el("div", { class: "lg-lock", html: '<svg viewBox="0 0 24 24" width="26" height="26"><path fill="#fff" d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h6V7a3 3 0 0 0-6 0v3z"/></svg>' }),
        el("div", { class: "lg-top" }, [
          el("div", { class: "lg-left" }, [el("div", { class: "lg-shield" }), el("p", { text: "お手元のログイン情報に記載されているID・パスワードを入力し、「Log in」ボタンを押して下さい。" })]),
          el("div", { class: "lg-right" }, [
            el("h2", { text: "ログイン" }),
            el("label", { text: "ユーザーID" }), uid,
            el("label", { text: "パスワード" }), pw,
            btn, msg

      foot: el("div", { class: "win-foot" }, [el("button", { class: "btn navy", text: "閉じる", onclick: closeMemo })]),
      resizable: true, style: "left:calc(50% - 330px);top:110px;width:660px;height:470px"
    });
    area.focus();
  }
  function closeMemo() { if (memoWin) { memoWin.remove(); memoWin = null; } if (window.CSS && CSS.highlights) CSS.highlights.delete("memo-hit"); }

  // 電卓（本番：± AC BS ÷ / 7 8 9 × / 4 5 6 − / 1 2 3 + / 0 00 . =、大きさは「小・中・大」、閉じるときは「電卓」ボタン）
  var calcWin = null;
  function toggleCalc() {
    if (calcWin) { calcWin.remove(); calcWin = null; return; }
    var disp = el("div", { class: "calc-disp", text: "0" }), cur = "0", acc = null, op = null, fresh = true;
    function show(s) {
      if (s === "NaN" || s === "Infinity" || s === "-Infinity") s = "E";
      else if (s.replace(/[-.]/g, "").length > 12) s = String(Number(Number(s).toPrecision(12)));
      disp.textContent = s;
    }
    function calc(a, b, o) { var r = o === "+" ? a + b : o === "−" ? a - b : o === "×" ? a * b : (b === 0 ? NaN : a / b); return Math.round(r * 1e10) / 1e10; }
    function digits(d) {
      if (fresh || cur === "0") { cur = d === "00" ? "0" : d; fresh = false; return; }
      if (cur.replace(/[-.]/g, "").length + d.length > 12) return;
      cur += d;
    }
    function press(k) {
      if (/^[0-9]$/.test(k) || k === "00") digits(k);
      else if (k === ".") { if (fresh) { cur = "0."; fresh = false; } else if (cur.indexOf(".") < 0) cur += "."; }
      else if (k === "AC") { cur = "0"; acc = null; op = null; fresh = true; }
      else if (k === "BS") { if (!fresh) cur = cur.length > 1 && cur !== "-0" ? cur.slice(0, -1) : "0"; if (cur === "-") cur = "0"; }
      else if (k === "±") { if (cur !== "0") cur = cur[0] === "-" ? cur.slice(1) : "-" + cur; }
      else if (k === "=") { if (op != null && acc != null) { cur = String(calc(acc, parseFloat(cur), op)); acc = null; op = null; fresh = true; } }
      else { if (op != null && acc != null && !fresh) cur = String(calc(acc, parseFloat(cur), op)); acc = parseFloat(cur); op = k; fresh = true; }
      show(cur);
    }
    var keys = ["±", "AC", "BS", "÷", "7", "8", "9", "×", "4", "5", "6", "−", "1", "2", "3", "+", "0", "00", ".", "="];
    var grid = el("div", { class: "calc-keys" }, keys.map(function (k) { return el("button", { text: k, onclick: function () { press(k); } }); }));
    var SIZES = { 小: [190, 245, 13], 中: [250, 320, 17], 大: [320, 410, 22] }, szBtns = {};
    function setSize(s) {
      calcWin.style.width = SIZES[s][0] + "px"; calcWin.style.height = SIZES[s][1] + "px";
      calcWin.querySelector(".calc").style.fontSize = SIZES[s][2] + "px";
      Object.keys(szBtns).forEach(function (k) { szBtns[k].classList.toggle("on", k === s); });
    }
    ["小", "中", "大"].forEach(function (s) { szBtns[s] = el("button", { class: "csz", text: s, onclick: function () { setSize(s); } }); });
    calcWin = makeWin({ cls: "calc-win", titleChildren: [el("span", { text: "電卓" })],
      body: el("div", { class: "calc" }, [el("div", { class: "calc-band" }, [szBtns["小"], szBtns["中"], szBtns["大"]]), disp, grid]),
      style: "left:" + (window.innerWidth - 300) + "px;top:110px" });
    setSize("小");
  }

  // 問題（別画面）
  function togglePopup() {
    if (popupState) { popupState.win.remove(); popupState = null; return; }
    var viewer = buildProblemViewer(), big = el("button", { class: "sz", text: "大" }), std = el("button", { class: "sz on", text: "標準" }), win;
    function setSize(isBig) {
      big.classList.toggle("on", isBig); std.classList.toggle("on", !isBig);
      if (isBig) { win.style.width = Math.round(window.innerWidth * 0.9) + "px"; win.style.height = Math.round(window.innerHeight * 0.86) + "px"; win.style.left = "5%"; win.style.top = "6%"; }
      else { win.style.width = Math.round(window.innerWidth * 0.55) + "px"; win.style.height = Math.round(window.innerHeight * 0.7) + "px"; }
      viewer.relayout();
    }
    big.addEventListener("click", function () { setSize(true); }); std.addEventListener("click", function () { setSize(false); });
    win = makeWin({ titleChildren: [el("span", { text: "問題（別画面）" }), el("span", { class: "grow" }), big, std, el("button", { class: "x", text: "×", onclick: togglePopup })],
      body: el("div", { class: "win-body" }, [viewer.toolbar, viewer.scroll]),
      foot: el("div", { class: "win-foot" }, [el("button", { class: "btn green", text: "閉じる", onclick: togglePopup })]),
      resizable: true, cls: "green", style: "left:8%;top:12%" });
    popupState = { win: win, viewer: viewer };
    setSize(false); viewer.show(S.cur);
    if (window.ResizeObserver) new ResizeObserver(function () { viewer.relayout(); }).observe(win);
  }

  // 参考資料・注意事項
  var refWin = null;
  function openReference() {
    if (refWin) return;
    var content = el("div", { class: "ref-content" }), refPages = referencePages(), refZoom = 100;
    var tabsDef = [["注意事項", function () {
      return [el("h3", { text: "試験中の注意事項" }), el("ul", null, [
        el("li", { text: "試験時間は " + EXAM.duration + " 分です。残り時間は画面右上に表示されます。" }),
        el("li", { text: "解答する問題は「問題選択」で選び、必ず「選択」ボタンを押してください。必須問題は最初から選択されています。" }),
        el("li", { text: "採点は選択された問題だけが対象です。" }),
        el("li", { text: "問題文のコピー・貼り付けはできません。解答欄とメモの間では、カット・コピー・ペーストボタンを使ってください。" }),
        el("li", { text: "解答は自動で保存されます。残り時間が0になると、自動的に提出されます。" })
      ])];
    }]];
    if (refPages) tabsDef.push(["参考資料", function () {
      var zr = el("input", { type: "range", min: 50, max: 200, step: 10, value: refZoom });
      var imgs = refPages.map(function (src) { return el("img", { src: src, alt: "", draggable: "false" }); });
      function apply() { imgs.forEach(function (im) { im.style.maxWidth = (9 * refZoom) + "px"; }); }
      zr.addEventListener("input", function () { refZoom = +zr.value; apply(); }); apply();
      return [el("div", { style: "font-size:11px;margin-bottom:8px" }, ["拡大・縮小 ", zr])].concat(imgs);
    }]);
    tabsDef.push(["問題選択", function () { return [el("p", { text: "画面上部の「問題選択」ボタンで、解答する問題（大問）を選びます。「選択中：○ / ○ 問」は、選んだ問題数と選択が必要な問題数です。何度でも選び直せますが、「選択」ボタンを押すまでは反映されません。" })]; }]);
    tabsDef.push(["問題（別画面）", function () { return [el("p", { text: "画面下部の「問題（別画面）」ボタンで、表示中の問題文を別ウィンドウに表示します。「大」「標準」でサイズを変えられます。別画面のマーカーは元の画面とは別に保持されます。" })]; }]);
    tabsDef.push(["マーカー", function () { return [el("p", { text: "問題文の上のツールバーで、マーカーモードのオフ（通常のポインター）、赤・青・黄色のマーカー、消しゴムを切り替えます。「サイズ」で太さを変え、「クリア」で表示中の問題のマーカーを一括して消します。" })]; }]);
    tabsDef.push(["解答欄", function () { return [el("p", { text: "選択ボタンは、もう一度押すと未解答に戻ります。1行解答欄には文字数の入力制限がある場合があります。複数行解答欄は右下に入力文字数と上限文字数が表示され、上限を超えた分は削除されます。設問番号の上のチェックボックスで「後で見直すもの」にできます。" })]; }]);
    var tabBtns = [];
    function showTab(i) {
      tabBtns.forEach(function (b, j) { b.classList.toggle("on", i === j); });
      content.innerHTML = ""; tabsDef[i][1]().forEach(function (n) { content.appendChild(n); }); content.scrollTop = 0;
    }
    var tabs = el("div", { class: "tabs" }, tabsDef.map(function (t, i) { var b = el("button", { text: t[0], onclick: function () { showTab(i); } }); tabBtns.push(b); return b; }));
    function close() { refWin.remove(); refWin = null; }
    refWin = makeWin({ titleChildren: [el("span", { text: refPages ? "参考資料" : "注意事項" }), el("span", { class: "grow" }), el("button", { class: "x", text: "×", onclick: close })],
      body: el("div", { class: "win-body" }, [tabs, content]),
      foot: el("div", { class: "win-foot" }, [el("button", { class: "btn navy", text: "閉じる", onclick: close })]),
      resizable: true, style: "left:calc(50% - 380px);top:90px;width:760px;height:" + Math.round(window.innerHeight * 0.78) + "px" });
    showTab(refPages ? 1 : 0);
  }

  // ---------------------------------------------------------------------
  // ダイアログ・試験終了
  // ---------------------------------------------------------------------
  function dialog(title, message, onYes, withNo) {
    var bg = el("div", { class: "modal-bg" }, [el("div", { class: "dialog" }, [
      el("h4", { text: title }), el("p", { text: message, style: "white-space:pre-wrap" }),
      el("div", { class: "row" }, [
        el("button", { class: "btn navy", text: onYes ? "はい" : "OK", onclick: function () { bg.remove(); if (onYes) onYes(); } }),
        (onYes && withNo !== false) ? el("button", { class: "btn navy", text: "いいえ", onclick: function () { bg.remove(); } }) : null
      ])
    ])]);
    document.body.appendChild(bg);
  }
  function confirmEnd() {
    if (TUTORIAL) { dialog("確認", "チュートリアルを終了します。", function () { finishExam(false); }); return; }
    if (S.selected.length < EXAM.selectionLimit) {
      dialog("確認", "選択可能な問題数に対して，現在選択している問題数が不足しています。\n選択していない問題については採点されませんが，よろしいですか？", function () { finishExam(false); });
    } else {
      dialog("確認", "科目B試験を終了します。", function () { finishExam(false); });
    }
  }
  function cleanupWindows() {
    [selWin, memoWin, calcWin, refWin].forEach(function (w) { if (w) w.remove(); });
    selWin = memoWin = calcWin = refWin = null;
    if (popupState) { popupState.win.remove(); popupState = null; }
    Array.prototype.forEach.call(document.querySelectorAll(".modal-bg"), function (n) { n.remove(); });
  }
  var finishing = false;
  function leaveExam() {
    clearInterval(timerId); clearInterval(saveTimer);
    cleanupWindows();
    document.body.classList.remove("in-exam");
    document.documentElement.classList.remove("inverted");
  }
  function finishExam(isAuto) {
    if (finishing) return;
    finishing = true;
    leaveExam();
    if (TUTORIAL) {
      finishing = false; TUTORIAL = false;
      root.innerHTML = "";
      root.appendChild(el("div", { class: "tt-wrap" }, [
        el("div", { class: "tt-head", text: "受験者向け チュートリアル" }),
        el("div", { class: "tt-body", text: "チュートリアルは終了しました。\n\n画面右下の「試験一覧へ」ボタンを押して、試験一覧に戻ってください。" }),
        el("div", { class: "tt-foot" }, [el("button", { class: "btn navy tt-go", text: "試験一覧へ", onclick: boot })])
      ]));
      return;
    }
    overlay("試験を終了しています...");
    var tries = 0;
    (function send() {
      api("submitExam", SESSION.id, payload(), !!isAuto).then(function () {
        overlay(null); store("apcbt-gas:" + SESSION.id, null); finishing = false;
        try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
        boot();
      }).catch(function () {
        tries++;
        overlay("通信できません。この画面のまま試験監督員にお声がけください。（再送信 " + tries + " 回目）");
        setTimeout(send, Math.min(30000, 3000 * tries));
      });
    })();
  }

  // ======================================================================
  // 解答例との見比べ（練習用）
  // ======================================================================
  function norm(s) { return toHalf(s).replace(/[\s,，、。．.]/g, "").toLowerCase(); }
  function openReview(examId) {
    overlay("読み込み中...");
    api("getReviewData", examId).then(function (d) {
      overlay(null);
      var exam = d.exam, sel = d.session.selected, answers = (d.session.data && d.session.data.answers) || {};
      root.innerHTML = "";
      var wrap = el("div", { class: "review" }, [el("h2", { text: "解答例と見比べる（" + exam.examName + "）" })]);
      exam.questions.forEach(function (q) {
        if (!(q.required || sel.indexOf(q.questionId) >= 0)) return;
        var tbl = el("table", null, [el("tr", null, [el("th", { text: "設問", style: "width:130px" }), el("th", { text: "あなたの解答" }), el("th", { text: "解答例" }), el("th", { text: "", style: "width:40px" })])]);
        q.subQuestions.forEach(function (sq) {
          var v = answers[sq.sub_q_id]; v = Array.isArray(v) ? v.join("，") : (v || "");
          var objective = sq.type === "選択" || sq.type === "多答";
          var ok = objective && sq.answer && norm(v) === norm(sq.answer);
          tbl.appendChild(el("tr", null, [
            el("td", { text: sq.sub_q_number }), el("td", { class: "mine", text: v || "（未解答）" }),
            el("td", null, [el("div", { class: "model", text: sq.answer || "（解答例未登録）" }), sq.note ? el("div", { class: "note", text: "※" + sq.note }) : null]),
            el("td", null, [objective && sq.answer ? el("span", { class: ok ? "auto-ok" : "auto-ng", text: ok ? "○" : "×" }) : null])
          ]));
        });
        wrap.appendChild(el("div", { class: "review-prob" }, [el("h3", { text: q.qNumber + "　" + (q.category || "") + "　" + (q.theme || "") }), tbl]));
      });
      wrap.appendChild(el("p", { style: "font-size:12px;color:#666", text: "解答例は IPA 公表の「解答例」によります。記述式は採点講評もあわせて確認してください。" }));
      wrap.appendChild(el("button", { class: "btn", text: "試験一覧へ", onclick: boot, style: "height:30px" }));
      root.appendChild(el("div", { class: "top-wrap" }, [wrap]));
    }).catch(function (err) { overlay(null); dialog("確認", String(err.message || err), null); });
  }

  boot();
})();
