<script>
/*
 * 応用情報技術者試験 科目B CBT模擬試験（GAS版・学生画面）
 * 画面構成・操作は CBT-Solutions 公開の「科目B群 試験当日の試験アプリ 操作方法のご案内」に合わせている。
 * 解答は端末にも控えを残しつつ、一定間隔でサーバー（受験記録シート）に保存する。
 */
(function () {
  "use strict";

  // ======================================================================
  // ユーティリティ
  // ======================================================================
  function $(sel, r) { return (r || document).querySelector(sel); }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else if (k === "style") e.style.cssText = v;
      else e.setAttribute(k, v === true ? "" : v);
    }
    (children || []).forEach(function (c) {
      if (c == null || c === false) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }
  function store(key, val) {
    try {
      if (val === undefined) { var s = localStorage.getItem(key); return s ? JSON.parse(s) : null; }
      if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { return null; }
  }
  function chars(s) { return Array.from(s || "").length; }
  function cut(s, n) { return Array.from(s || "").slice(0, n).join(""); }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function toHalf(s) { return String(s || "").replace(/[０-９Ａ-Ｚａ-ｚ（）]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); }

  /** google.script.run を Promise で呼ぶ */
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[name].apply(r, args);
    });
  }

  var root = document.getElementById("root");
  var PORTAL = null;            // getPortalData の結果
  var EXAM = null, PROBS = [], SESSION = null, STUDENT = null;
  var S = null;                 // 受験中の状態 { selected, answers, flags, memo, cur, leaveCount }
  var clockOffset = 0;          // サーバー時刻 - 端末時刻
  var clip = "";

  // ======================================================================
  // 小問マスタ → CBT の解答欄
  // ======================================================================
  function splitLabel(s) {
    s = toHalf(s).trim();
    var m = s.match(/^(設問\s*\d+\s*(?:\(\d+\))?)\s*(.*)$/);
    if (!m) return { label: s, key: "" };
    return { label: m[1].replace(/\s+/g, ""), key: m[2].trim() };
  }
  function toField(sq, key) {
    var t = sq.type, lim = String(sq.limit || "").trim();
    var f = { sid: sq.sub_q_id, key: key };
    if (t === "選択") {
      f.type = key ? "pulldown" : "choice";
      f.options = lim ? lim.split(/[,，、]/).map(function (x) { return x.trim(); }).filter(String) : ["ア", "イ", "ウ", "エ"];
    } else if (t === "多答") {
      f.type = "multi";
      var m = lim.match(/^(\d+)\s*[:：]\s*(.*)$/);
      if (m) { f.limit = parseInt(m[1], 10); lim = m[2]; }
      f.options = lim ? lim.split(/[,，、]/).map(function (x) { return x.trim(); }).filter(String) : ["ア", "イ", "ウ", "エ"];
    } else if (t === "図表") {
      f.type = "none";
      f.text = "（図表で解答する設問のため、解答入力欄はありません）";
    } else if (t === "記述" && /^[（(]/.test(lim)) {
      f.type = "none";
      f.text = lim;
    } else {
      var n = parseInt(toHalf(lim), 10) || 0;
      if (t === "記述" && n > 15) { f.type = "text"; f.max = n; }
      else { f.type = "line"; f.max = n || 60; }
    }
    return f;
  }
  function buildProblems(exam) {
    var man = window.CBT_IMG_MANIFEST || {};
    var base = (PORTAL && PORTAL.imageBase) || "";
    return exam.questions.map(function (q, i) {
      var items = [], byLabel = {};
      q.subQuestions.forEach(function (sq) {
        var p = splitLabel(sq.sub_q_number);
        var it = byLabel[p.label];
        if (!it) { it = byLabel[p.label] = { label: p.label, fields: [] }; items.push(it); }
        it.fields.push(toField(sq, p.key));
      });
      var n = man[q.questionId] || 0, pages = null;
      if (n && base) { pages = []; for (var k = 1; k <= n; k++) pages.push(base + q.questionId + "/" + k + ".png"); }
      return { idx: i, qid: q.questionId, label: q.qNumber, title: q.category || "", theme: q.theme || "",
        source: q.source || "", required: q.required, pdfId: q.pdfId, pages: pages, items: items };
    });
  }
  function tutorialProblems() {
    var p1 = '<h1 class="tt">受験者向け チュートリアル</h1>' +
      '<p>このチュートリアルでは、試験画面の操作方法を確認します。実際の試験と同じ操作ができます。入力した内容は保存されません。</p>' +
      '<h2>画面の構成</h2><ul>' +
      '<li>画面の左側に「問題文」、右側に「解答欄」が表示されます。左右の枠の境目をドラッグすると、表示の割合を変えられます。</li>' +
      '<li>画面上部には、残り時間と「問題選択」「メモ」「参考資料（注意事項）」「試験終了」ボタン、「白黒反転」が表示されます。</li>' +
      '<li>問題文の上のツールバーで、問題文の拡大・縮小、マーカー（赤・青・黄、消しゴム、サイズ、クリア）を使えます。</li>' +
      '<li>画面下部には「解答状況」「電卓」「問題（別画面）」「後で見直す」「前の問題」「次の問題」ボタンが表示されます。</li></ul>' +
      '<p>「次の問題」ボタンで次のページに進んでください。</p>';
    var p2 = '<h2>試験中の操作</h2><ul>' +
      '<li><b>問題選択</b>：試験開始時に「問題選択」の画面が表示されます。必須の問題は選択された状態です。解答する問題番号を選び、必ず「選択」ボタンを押してください。試験時間内は何度でも選び直せます。</li>' +
      '<li><b>後で見直す</b>：判断に迷う設問は、設問番号の上のチェックボックスを選択します。「後で見直す」ボタンを押すと、表示中の問題の解答欄すべてにチェックが付きます。</li>' +
      '<li><b>解答状況</b>：「未解答」「解答済み」「後で見直すもの」「解答中」が色分けされた設問の一覧が表示され、選択するとその設問に移動します。</li>' +
      '<li><b>メモ</b>：画面上にメモを表示します。カット・コピー・ペーストはボタンで行います。キー操作でのカット・コピー・ペーストや、問題文のコピーはできません。</li>' +
      '<li><b>電卓</b>：画面上に電卓を表示します。「小・中・大」で大きさを変えられ、タイトルバーをドラッグして移動できます。</li>' +
      '<li><b>問題（別画面）</b>：同じ問題文を別のウィンドウで表示します。</li>' +
      '<li><b>試験終了</b>：受験している科目を終了します。残り時間が0になった場合は自動的に終了します。</li></ul>' +
      '<p>マーカーで、この文章に線を引いてみましょう。</p>';
    var p3 = '<p>操作確認用のサンプル問題です。解答の操作をしてみましょう。</p>' +
      '<p>チュートリアルはこのページで終了です。<br>本試験に進む場合は、画面右上の「確認終了」ボタンを押してチュートリアルを終了してください。</p>' +
      '<p><b>設問1</b>　選択による解答です。<br>下記の[ a ]に入る値を選択しなさい。<br>1 ＋ 1 ＝ [ a ]</p><p class="opts">ア　1　　イ　2　　ウ　3　　エ　4</p>' +
      '<p><b>設問2</b>　チェックボックスによる解答です。<br>計算結果が「2」になるものをすべて選択しなさい。</p><p class="opts">ア　1＋1　　イ　2×2　　ウ　4÷2　　エ　2－1</p>' +
      '<p><b>設問3</b>　プルダウンによる解答です。<br>3 － 1 ＝ [ b ]　の[ b ]に入る値を選択しなさい。</p>' +
      '<p><b>設問4</b>　1行の解答欄です。<br>100 ＋ 23 の計算結果を数字で入力しなさい。</p>' +
      '<p><b>設問5</b>　複数行の解答欄です。<br>自由に文章を入力してみましょう（100字以内）。</p>';
    function f(sid, type, extra) { var o = { sid: sid, key: "", type: type }; for (var k in extra) o[k] = extra[k]; return o; }
    return [
      { idx: 0, qid: "tut1", label: "1ページ目", title: "", pages: [{ html: p1 }], items: [{ label: "1ページ目", fields: [] }] },
      { idx: 1, qid: "tut2", label: "2ページ目", title: "", pages: [{ html: p2 }], items: [{ label: "2ページ目", fields: [] }] },
      { idx: 2, qid: "tut3", label: "3ページ目", title: "", pages: [{ html: p3 }], items: [
        { label: "設問1", fields: [f("t1", "choice", { options: ["ア", "イ", "ウ", "エ"] })] },
        { label: "設問2", fields: [f("t2", "multi", { options: ["ア", "イ", "ウ", "エ"] })] },
        { label: "設問3", fields: [f("t3", "pulldown", { options: ["1", "2", "3", "4"] })] },
        { label: "設問4", fields: [f("t4", "line", { max: 10 })] },
        { label: "設問5", fields: [f("t5", "text", { max: 100 })] }
      ] }
    ];
  }

  function referencePages() {
    var man = window.CBT_IMG_MANIFEST || {}, base = (PORTAL && PORTAL.imageBase) || "";
    for (var i = 0; i < PROBS.length; i++) {
      var id = PROBS[i].qid.replace(/_pm\d+$/, "_ref");
      if (man[id] && base) { var a = []; for (var k = 1; k <= man[id]; k++) a.push(base + id + "/" + k + ".png"); return a; }
    }
    return null;
  }
  function loadManifest(cb) {
    if (!PORTAL.imageBase || window.CBT_IMG_MANIFEST) { cb(); return; }
    var s = document.createElement("script");
    s.src = PORTAL.imageBase + "manifest.js";
    s.onload = cb; s.onerror = cb;
    document.head.appendChild(s);
  }

  // ======================================================================
  // キー操作によるコピー・貼り付けの禁止（本番仕様）
  // ======================================================================
  function inExam() { return document.body.classList.contains("in-exam"); }
  ["copy", "cut", "paste", "drop", "dragstart", "contextmenu"].forEach(function (t) {
    document.addEventListener(t, function (e) { if (inExam()) e.preventDefault(); }, true);
  });
  document.addEventListener("keydown", function (e) {
    if (!inExam()) return;
    var k = (e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ["c", "x", "v", "p", "s", "f", "u", "a"].indexOf(k) >= 0 && !(k === "a" && /^(INPUT|TEXTAREA)$/.test(e.target.tagName))) e.preventDefault();
    if (k === "f5" || k === "f12" || ((e.ctrlKey || e.metaKey) && k === "r")) e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i", "j", "c"].indexOf(k) >= 0) e.preventDefault();
  }, true);
  window.addEventListener("beforeunload", function (e) { if (inExam()) { e.preventDefault(); e.returnValue = ""; } });

  // 画面離脱（別のタブ・ウィンドウへの切り替え、全画面の解除）を数える
  document.addEventListener("visibilitychange", function () { if (inExam() && document.hidden) noteLeave(); });
  document.addEventListener("fullscreenchange", function () { if (inExam() && !document.fullscreenElement) noteLeave(); });
  var lastLeave = 0;
  function noteLeave() {
    if (Date.now() - lastLeave < 1500) return;
    lastLeave = Date.now();
    S.leaveCount = (S.leaveCount || 0) + 1;
    markDirty();
  }

  // ======================================================================
  // 画面: 試験一覧（ポータル）
  // ======================================================================
  var CREDS = null;      // ログイン画面で入力したユーザーID・パスワード
  var TUTORIAL = false;  // 受験者向けチュートリアル中
  var IME = "romaji";

  function boot() {
    root.innerHTML = '<div class="loading">読み込み中...</div>';
    api("getPortalData", CREDS).then(function (d) {
      PORTAL = d;
      if (d.loginRequired && !CREDS) { renderLogin(); return; }
      loadManifest(renderPortal);
    }).catch(function (err) {
      root.innerHTML = "";
      root.appendChild(el("div", { class: "loading", text: "読み込みに失敗しました。ページを再読み込みしてください。（" + (err.message || err) + "）" }));
    });
  }

  // ---------------------------------------------------------------------
  // ログイン画面（本番：ログイン情報シートのユーザーID・パスワードを入力して「Log in」）
  // ---------------------------------------------------------------------
  function renderLogin(errMsg) {
    document.body.classList.remove("in-exam");
    root.innerHTML = "";
    var uid = el("input", { type: "text", class: "lg-input", autocomplete: "off", spellcheck: "false" });
    var pw = el("input", { type: "password", class: "lg-input", autocomplete: "off" });
    var btn = el("button", { class: "lg-btn", text: "Log in", disabled: true });
    function upd() { btn.disabled = !(uid.value.trim() && pw.value); }
    uid.addEventListener("input", upd); pw.addEventListener("input", upd);
    pw.addEventListener("keydown", function (e) { if (e.key === "Enter" && !btn.disabled) btn.click(); });
    var msg = el("div", { class: "lg-err", text: errMsg || "" });
    btn.addEventListener("click", function () {
      btn.disabled = true; msg.textContent = "";
      api("login", uid.value.trim(), pw.value).then(function (r) {
        nameConfirm(r, function () { CREDS = { userId: uid.value.trim(), password: pw.value }; boot(); }, function () { pw.value = ""; upd(); });
      }).catch(function (err) { msg.textContent = String(err.message || err); upd(); });
    });
    root.appendChild(el("div", { class: "lg-wrap" }, [
      el("div", { class: "lg-card" }, [
        el("div", { class: "lg-lock", html: '<svg viewBox="0 0 24 24" width="26" height="26"><path fill="#fff" d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h6V7a3 3 0 0 0-6 0v3z"/></svg>' }),
        el("div", { class: "lg-top" }, [
          el("div", { class: "lg-left" }, [el("div", { class: "lg-shield" }), el("p", { text: "お手元のログイン情報に記載されているID・パスワードを入力し、「Log in」ボタンを押して下さい。" })]),
          el("div", { class: "lg-right" }, [
            el("h2", { text: "ログイン" }),
            el("label", { text: "ユーザーID" }), uid,
            el("label", { text: "パスワード" }), pw,
            btn, msg
          ])
        ]),
        el("div", { class: "lg-bottom" }, [el("div", { class: "lg-brand", text: "応用情報技術者試験 科目B CBT模擬試験" }), el("div", { class: "lg-brand-sub", text: "非公式の練習用アプリです。IPA・CBT-Solutions とは関係ありません。" })])
      ])
    ]));
    uid.focus();
  }

  /** 氏名確認のポップアップ（OK / キャンセル） */
  function nameConfirm(r, onOk, onCancel) {
    var bg = el("div", { class: "modal-bg" }, [el("div", { class: "nc-box" }, [
      el("div", { class: "nc-title" }, [el("span", { text: "氏名確認" }), el("button", { class: "nc-x", text: "×", onclick: function () { bg.remove(); onCancel(); } })]),
      el("div", { class: "nc-name" }, [
        r.kana ? el("div", { class: "nc-kana", text: r.kana }) : null,
        el("div", { class: "nc-kanji", text: r.studentName + " 様" })
      ]),
      el("div", { class: "nc-text", text: "表示された氏名とご自身の氏名に相違ないかご確認ください。\n\n相違なければ[OK]ボタンをクリックしてください。\nご本人以外の氏名が表示されている場合は、試験監督員にお声がけください。\n試験監督員の指示に従い[キャンセル]をクリックしてください。" }),
      el("div", { class: "row" }, [
        el("button", { class: "btn navy", text: "OK", onclick: function () { bg.remove(); onOk(); } }),
        el("button", { class: "btn navy", text: "キャンセル", onclick: function () { bg.remove(); onCancel(); } })
      ])
    ])]);
    document.body.appendChild(bg);
  }

  // ---------------------------------------------------------------------
  // トップ画面（試験一覧）
  // ---------------------------------------------------------------------
  var manualInputs = null;
  function renderPortal() {
    document.body.classList.remove("in-exam");
    document.documentElement.classList.remove("inverted");
    root.innerHTML = "";
    var st = PORTAL.student;
    var invSw = el("div", { class: "switch", onclick: function () {
      invSw.classList.toggle("on"); document.documentElement.classList.toggle("inverted", invSw.classList.contains("on"));
    } });
    var imeR = el("input", { type: "radio", name: "ime", checked: IME === "romaji" }), imeK = el("input", { type: "radio", name: "ime", checked: IME === "kana" });
    imeR.addEventListener("change", function () { IME = "romaji"; }); imeK.addEventListener("change", function () { IME = "kana"; });
    manualInputs = null;
    var profile = null;
    if (!st) {   // ログイン画面を使わない設定で、名簿にアカウントがない場合だけ
      var cls = el("input", { type: "text", placeholder: "クラス", style: "width:110px" });
      var num = el("input", { type: "text", placeholder: "番号", style: "width:70px" });
      var nm = el("input", { type: "text", placeholder: "氏名", style: "width:200px" });
      manualInputs = { cls: cls, num: num, nm: nm };
      profile = el("div", { class: "tl-ime" }, [el("div", { style: "color:#c00;margin-bottom:6px", text: "名簿にアカウントが見つかりません。クラス・番号・氏名を入力してください。" }), cls, " ", num, " ", nm]);
    }
    function row(name, btnLabel, onClick, disabled) {
      return el("div", { class: "tl-row" }, [el("span", { text: name }), el("button", { class: "tl-take", text: btnLabel, disabled: !!disabled, onclick: onClick })]);
    }
    var rows = [row("受験者向け チュートリアル", "受験する", startTutorial)];
    (PORTAL.exams || []).forEach(function (e) {
      if (e.status === "提出済み") {
        rows.push(e.canReview ? row(e.examName, "解答例を見る", function () { openReview(e.examId); }) : row(e.examName, "受験済み", null, true));
      } else {
        rows.push(row(e.examName, "受験する", function () { startReal(e); }));
      }
    });
    root.appendChild(el("div", { class: "tl-wrap" }, [
      el("div", { class: "tl-bar" }, [
        el("span", { class: "tl-user", text: st ? st.studentClass + "-" + st.studentNum + "　" + st.studentName : "" }),
        el("button", { class: "tl-logout", html: '<svg viewBox="0 0 24 24" width="15" height="15"><path fill="#fff" d="M10 3h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-9v-2h9V5h-9V3zm-1 5l1.4 1.4L8.8 11H16v2H8.8l1.6 1.6L9 16l-4-4 4-4z"/></svg>ログアウト', onclick: function () { CREDS = null; boot(); } })
      ]),
      el("div", { class: "tl-main" }, [
        el("div", { class: "tl-inv" }, [el("span", { text: "白黒反転" }), invSw]),
        el("p", { class: "tl-p", text: "試験終了後は、画面右上の「ログアウト」をクリックし、必ずログアウトしてください。\n試験中に画像が不鮮明で見えづらいなど解答に支障が生じた場合は、試験監督員にお声がけください。" }),
        el("p", { class: "tl-p", text: "まずは「受験者向け チュートリアル」で試験の操作内容をご確認ください。\nチュートリアルで試験の操作内容が確認できましたら、本試験を開始してください。" }),
        el("p", { class: "tl-p red", text: "試験開始時刻になりましたら、本試験の「受験する」ボタンを押していなくても、本試験の「残り時間」のカウントダウンは開始されており、試験終了時刻に試験は終了します。\n本試験前のチュートリアルは、試験開始時刻を超えていても実施できますが、同様に本試験のカウントダウンが進んでいます。" }),
        el("div", { class: "tl-ime" }, [
          el("div", { text: "試験中に希望する文字入力方式をご選択ください。" }),
          el("div", { class: "tl-radios" }, [el("label", null, [imeR, " ローマ字入力"]), el("label", null, [imeK, " かな入力"])]),
          el("input", { type: "text", class: "tl-try", placeholder: "入力してください。入力内容は問いません。" }),
          el("div", { text: "ご選択後、入力が正常に行えるか上記入力欄にてお試しください。\n不備がある場合は、試験開始前に試験監督員をお呼び出しください。" })

  function requestFullscreen() {

  // ======================================================================
  // 自動保存
  // ======================================================================
  var dirty = false, saving = false, saveTimer = 0, saveStateEl = null, lastOk = 0;

  function save(force) {

      api("pingSession", SESSION.id).then(applyServerState).catch(function () {});
      return;

  // ---------------------------------------------------------------------
  // 問題文ビューア（拡大縮小・マーカー）。画像がない大問はドライブのPDFを表示する
  // ---------------------------------------------------------------------
  function buildProblemViewer() {
    var v = { zoom: 100, tool: "pointer", size: 1.0, cache: {}, cur: -1 };
    var pct = el("span", { class: "pct", text: "100 %" });
    var zr = el("input", { type: "range", min: 50, max: 200, step: 10, value: 100 });
    zr.addEventListener("input", function () { v.zoom = +zr.value; pct.textContent = v.zoom + " %"; v.relayout(); });
    var sizeTxt = el("span", { text: "1.0x" });
    var sr = el("input", { type: "range", min: 5, max: 30, step: 1, value: 10, style: "width:60px" });
    sr.addEventListener("input", function () { v.size = sr.value / 10; sizeTxt.textContent = v.size.toFixed(1) + "x"; });
    var tools = {};
    function toolBtn(name, inner, title) {
      var b = el("button", { class: "tool" + (name === "pointer" ? " sel" : ""), title: title, onclick: function () {
        v.tool = name;
        Object.keys(tools).forEach(function (k) { tools[k].classList.toggle("sel", k === name); });
        scroll.classList.toggle("marking", name !== "pointer");
        scroll.classList.toggle("erasing", name === "eraser");
      } }, [inner]);
      tools[name] = b; return b;
    }
    var ptrSvg = '<svg viewBox="0 0 12 12"><path d="M3 1 L3 10.5 L5.3 8.2 L7 11.5 L8.3 10.9 L6.6 7.7 L9.8 7.7 Z" fill="#fff"/></svg>';
    var ersSvg = '<svg viewBox="0 0 12 12"><path d="M7.5 1.2 L10.8 4.5 L5.2 10.2 L2.2 10.2 L1 9 L1 8 Z" fill="#fff"/><path d="M3.8 5 L7.2 8.4" stroke="#1c3e72" stroke-width="1.2"/></svg>';
    var toolbar = el("div", { class: "toolbar" }, [
      el("span", { text: "拡大・縮小" }), zr, pct,
      toolBtn("pointer", el("span", { html: ptrSvg }), "マーカーモードのオフ"),
      toolBtn("red", el("i", { style: "background:#e21b1b" }), "赤"),
      toolBtn("blue", el("i", { style: "background:#1336d6" }), "青"),
      toolBtn("yellow", el("i", { style: "background:#ffe600" }), "黄"),
      toolBtn("eraser", el("span", { html: ersSvg }), "消しゴム"),
      el("span", { text: "サイズ" }), sr, sizeTxt,
      el("button", { class: "btn navy tb-clear", text: "クリア", onclick: function () {
        var c = v.cache[v.cur]; if (!c) return;
        c.canvases.forEach(function (cv) { cv.getContext("2d").clearRect(0, 0, cv.width, cv.height); });
      } })
    ]);
    var scroll = el("div", { class: "scroll" });
    v.toolbar = toolbar; v.scroll = scroll;
    var COLORS = { red: "#ff0000", blue: "#0000ff", yellow: "#ffd400" };
    function attachDraw(cv) {
      var drawing = false, last = null, base = null, pts = [];
      function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
      function redraw(ctx) {
        ctx.putImageData(base, 0, 0);
        ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.strokeStyle = COLORS[v.tool]; ctx.lineWidth = 3 * v.size * (cv.width / 860);
        ctx.beginPath();
        pts.forEach(function (p, i) { if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); });
        if (pts.length === 1) ctx.lineTo(pts[0].x + 0.1, pts[0].y);
        ctx.stroke(); ctx.restore();
      }
      function erase(ctx, a, b) {
        ctx.save(); ctx.globalCompositeOperation = "destination-out"; ctx.lineCap = "round"; ctx.lineWidth = 14 * v.size * (cv.width / 860);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x + 0.1, b.y); ctx.stroke(); ctx.restore();
      }
      cv.addEventListener("pointerdown", function (e) {
        if (v.tool === "pointer") return;
        e.preventDefault(); cv.setPointerCapture(e.pointerId);
        drawing = true; last = pos(e);
        var ctx = cv.getContext("2d");
        if (v.tool !== "eraser") { base = ctx.getImageData(0, 0, cv.width, cv.height); pts = [last]; redraw(ctx); } else erase(ctx, last, last);
      });

      if (v.cur === pi) return;
      Object.keys(v.cache).forEach(function (k) { v.cache[k].wrap.style.display = "none"; });
      v.cur = pi;
      var P = PROBS[pi];
      if (!v.cache[pi]) {
        var wrap, canvases = [];
        if (P.pages) {
          wrap = el("div", { class: "pages" });
          P.pages.forEach(function (src) {
            if (typeof src === "object") {   // HTML で書いたページ（チュートリアル）
              var paper = el("div", { class: "paper", html: src.html });
              var hc = el("canvas", { width: 860, height: 1200 });
              attachDraw(hc); canvases.push(hc);
              var pg = el("div", { class: "page html-page" }, [paper, hc]);
              wrap.appendChild(pg);
              return;
            }
            var cv = el("canvas", { width: 1074, height: 1520 });
            var im = el("img", { src: src, alt: "", draggable: "false" });
            im.addEventListener("load", function () {
              if (im.naturalWidth && (cv.width !== im.naturalWidth || cv.height !== im.naturalHeight)) { cv.width = im.naturalWidth; cv.height = im.naturalHeight; }
            });
            attachDraw(cv); canvases.push(cv);
            wrap.appendChild(el("div", { class: "page" }, [im, cv]));
          });
        } else {
          // 画像がまだ用意されていない大問（以前のシステムと同じくドライブのPDFを表示。マーカーは使えない）
          wrap = el("div", { class: "pdf-frame-wrap", style: "height:100%" }, [
            el("iframe", { src: P.pdfId ? "https://drive.google.com/file/d/" + P.pdfId + "/preview" : "about:blank" }),
            el("div", { class: "pdf-guard" })

        }
        scroll.appendChild(wrap);
        v.cache[pi] = { wrap: wrap, canvases: canvases, isPdf: !P.pages };
      }
      v.cache[pi].wrap.style.display = "";
      toolbar.style.visibility = v.cache[pi].isPdf ? "hidden" : "";
      v.relayout(); scroll.scrollTop = 0;
    };
    v.relayout = function () {
      var c = v.cache[v.cur]; if (!c || c.isPdf) return;
      var w = Math.max(200, scroll.clientWidth - 24);
      var pw = Math.round(w * v.zoom / 100);
      c.wrap.style.width = pw + "px";
      Array.prototype.forEach.call(c.wrap.querySelectorAll(".html-page"), function (pg) {
        var paper = pg.querySelector(".paper"), cv = pg.querySelector("canvas"), k = pw / 860;
        paper.style.transform = "scale(" + k + ")";
        var h = paper.offsetHeight;
        pg.style.height = Math.ceil(h * k) + "px";
        if (cv.height !== h) cv.height = h;
      });
    };
    return v;
  }

  // ---------------------------------------------------------------------
  // 解答欄
  // ---------------------------------------------------------------------
  function renderAnswers() {
    var pi = S.cur, P = PROBS[pi];
    rightView.innerHTML = "";
    if (!TUTORIAL && S.selected.indexOf(P.qid) < 0) rightView.appendChild(el("p", { class: "not-selected", text: "画面右上の「問題選択」から問題番号を選択したか確認してください。" }));
    P.items.forEach(function (it, ii) {
      var key = iid(pi, ii);
      var flag = el("button", { class: "flag" + (S.flags[key] ? " on" : ""), title: "後で見直す", onclick: function () {
        if (S.flags[key]) delete S.flags[key]; else S.flags[key] = true;
        flag.classList.toggle("on", !!S.flags[key]); markDirty();
      } });
      var box = el("div", { class: "item", "data-item": key }, [flag, el("div", { class: "item-label", text: it.label })]);
      it.fields.forEach(function (f) { box.appendChild(renderField(f)); });

    rightView.scrollTop = 0;
  }

  function renderField(f) {
    var id = f.sid, val = S.answers[id];
    function setVal(v) { if (isFilled(v)) S.answers[id] = v; else delete S.answers[id]; markDirty(); }
    var wrap = el("div", { class: "field" });
    if (f.key) wrap.appendChild(el("div", { class: "field-key", text: f.key }));
    if (f.type === "none") {
      wrap.appendChild(el("div", { style: "background:#f4f4f4;padding:8px 10px;color:#666;font-size:12px;border-left:4px solid #ccc", text: f.text }));
    } else if (f.type === "choice") {
      var list = el("div", { class: "choice-list" });
      f.options.forEach(function (o) {
        list.appendChild(el("button", { class: "choice-btn" + (val === o ? " sel" : ""), text: o, onclick: function () {
          var now = S.answers[id] === o ? "" : o;
          setVal(now);
          Array.prototype.forEach.call(list.children, function (c) { c.classList.toggle("sel", c.textContent === now); });
        } }));
      });
      wrap.appendChild(list);
    } else if (f.type === "multi") {
      var ml = el("div", { class: "multi-list" });
      if (f.limit) ml.appendChild(el("div", { style: "font-size:12px;color:#555", text: "※" + f.limit + "個選択" }));
      f.options.forEach(function (o) {
        var cb = el("input", { type: "checkbox", checked: Array.isArray(val) && val.indexOf(o) >= 0 });
        cb.addEventListener("change", function () {
          var cur = Array.isArray(S.answers[id]) ? S.answers[id].slice() : [];
          if (cb.checked) {
            if (f.limit && cur.length >= f.limit) { cb.checked = false; dialog("選択制限", "この設問は " + f.limit + " 個まで選択できます。", null); return; }
            if (cur.indexOf(o) < 0) cur.push(o);
          } else cur = cur.filter(function (x) { return x !== o; });
          cur.sort(function (a, b) { return f.options.indexOf(a) - f.options.indexOf(b); });
          setVal(cur);
        });
        ml.appendChild(el("label", null, [cb, o]));
      });
      wrap.appendChild(ml);
    } else if (f.type === "pulldown") {
      var sel = el("select", { class: "pull" }, [el("option", { value: "", text: "" })].concat(f.options.map(function (o) { return el("option", { value: o, text: o, selected: val === o }); })));
      sel.addEventListener("change", function () { setVal(sel.value); });
      wrap.appendChild(sel);
    } else if (f.type === "line") {
      var inp = el("input", { class: "line", type: "text", value: val || "", autocomplete: "off", spellcheck: "false" });
      var composing = false;
      function filter() { var v = inp.value; if (f.max) v = cut(v, f.max); if (v !== inp.value) inp.value = v; setVal(v); }
      inp.addEventListener("compositionstart", function () { composing = true; });
      inp.addEventListener("compositionend", function () { composing = false; filter(); });
      inp.addEventListener("input", function () { if (!composing) filter(); });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") e.preventDefault(); });
      wrap.appendChild(el("div", { class: "line-wrap" }, [inp]));

  function buildMultiBox(f, val, onChange) {
    var ta = el("textarea", { class: "multi", spellcheck: "false" });
    ta.value = val || "";
    var lines = Math.max(2, Math.ceil((f.max || 30) / 25) + 1);
    ta.style.minHeight = (lines * 24 + 10) + "px";
    var count = el("div", { class: "mbox-foot" });
    var composing = false;
    function upd(fromInput) {
      if (f.max && chars(ta.value) > f.max) {
        var pos = ta.selectionStart; ta.value = cut(ta.value, f.max);

    tabsDef.push(["問題選択", function () { return [el("p", { text: "画面上部の「問題選択」ボタンで、解答する問題（大問）を選びます。「選択中：○ / ○ 問」は、選んだ問題数と選択が必要な問題数です。何度でも選び直せますが、「選択」ボタンを押すまでは反映されません。" })]; }]);
    tabsDef.push(["問題（別画面）", function () { return [el("p", { text: "画面下部の「問題（別画面）」ボタンで、表示中の問題文を別ウィンドウに表示します。「大」「標準」でサイズを変えられます。別画面のマーカーは元の画面とは別に保持されます。" })]; }]);
    tabsDef.push(["マーカー", function () { return [el("p", { text: "問題文の上のツールバーで、マーカーモードのオフ（通常のポインター）、赤・青・黄色のマーカー、消しゴムを切り替えます。「サイズ」で太さを変え、「クリア」で表示中の問題のマーカーを一括して消します。" })]; }]);
    tabsDef.push(["解答欄", function () { return [el("p", { text: "選択ボタンは、もう一度押すと未解答に戻ります。1行解答欄には文字数の入力制限がある場合があります。複数行解答欄は右下に入力文字数と上限文字数が表示され、上限を超えた分は削除されます。設問番号の上のチェックボックスで「後で見直すもの」にできます。" })]; }]);
    var tabBtns = [];
    function showTab(i) {
      tabBtns.forEach(function (b, j) { b.classList.toggle("on", i === j); });
      content.innerHTML = ""; tabsDef[i][1]().forEach(function (n) { content.appendChild(n); }); content.scrollTop = 0;
    }
    var tabs = el("div", { class: "tabs" }, tabsDef.map(function (t, i) { var b = el("button", { text: t[0], onclick: function () { showTab(i); } }); tabBtns.push(b); return b; }));
    function close() { refWin.remove(); refWin = null; }
    refWin = makeWin({ titleChildren: [el("span", { text: refPages ? "参考資料" : "注意事項" }), el("span", { class: "grow" }), el("button", { class: "x", text: "×", onclick: close })],
      body: el("div", { class: "win-body" }, [tabs, content]),
      foot: el("div", { class: "win-foot" }, [el("button", { class: "btn navy", text: "閉じる", onclick: close })]),
      resizable: true, style: "left:calc(50% - 380px);top:90px;width:760px;height:" + Math.round(window.innerHeight * 0.78) + "px" });
    showTab(refPages ? 1 : 0);
  }

  // ---------------------------------------------------------------------
  // ダイアログ・試験終了
  // ---------------------------------------------------------------------
  function dialog(title, message, onYes, withNo) {
    var bg = el("div", { class: "modal-bg" }, [el("div", { class: "dialog" }, [
      el("h4", { text: title }), el("p", { text: message, style: "white-space:pre-wrap" }),
      el("div", { class: "row" }, [
        el("button", { class: "btn navy", text: onYes ? "はい" : "OK", onclick: function () { bg.remove(); if (onYes) onYes(); } }),
        (onYes && withNo !== false) ? el("button", { class: "btn navy", text: "いいえ", onclick: function () { bg.remove(); } }) : null
      ])
    ])]);
    document.body.appendChild(bg);
  }
  function confirmEnd() {
    if (TUTORIAL) { dialog("確認", "チュートリアルを終了します。", function () { finishExam(false); }); return; }
    if (S.selected.length < EXAM.selectionLimit) {
      dialog("確認", "選択可能な問題数に対して，現在選択している問題数が不足しています。\n選択していない問題については採点されませんが，よろしいですか？", function () { finishExam(false); });
    } else {
      dialog("確認", "科目B試験を終了します。", function () { finishExam(false); });
    }
  }
  function cleanupWindows() {
    [selWin, memoWin, calcWin, refWin].forEach(function (w) { if (w) w.remove(); });
    selWin = memoWin = calcWin = refWin = null;
    if (popupState) { popupState.win.remove(); popupState = null; }
    Array.prototype.forEach.call(document.querySelectorAll(".modal-bg"), function (n) { n.remove(); });
  }
  var finishing = false;
  function leaveExam() {
    clearInterval(timerId); clearInterval(saveTimer);
    cleanupWindows();
    document.body.classList.remove("in-exam");
    document.documentElement.classList.remove("inverted");
  }
  function finishExam(isAuto) {
    if (finishing) return;
    finishing = true;
    leaveExam();
    if (TUTORIAL) { finishing = false; TUTORIAL = false; boot(); return; }
    overlay("試験を終了しています...");
    var tries = 0;
    (function send() {
      api("submitExam", SESSION.id, payload(), !!isAuto).then(function () {
        overlay(null); store("apcbt-gas:" + SESSION.id, null); finishing = false;
        try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
        boot();
      }).catch(function () {
        tries++;
        overlay("通信できません。この画面のまま試験監督員にお声がけください。（再送信 " + tries + " 回目）");
        setTimeout(send, Math.min(30000, 3000 * tries));
      });
    })();
  }

  // ======================================================================
  // 解答例との見比べ（練習用）
  // ======================================================================
  function norm(s) { return toHalf(s).replace(/[\s,，、。．.]/g, "").toLowerCase(); }
  function openReview(examId) {
    overlay("読み込み中...");
    api("getReviewData", examId).then(function (d) {
      overlay(null);
      var exam = d.exam, sel = d.session.selected, answers = (d.session.data && d.session.data.answers) || {};
      root.innerHTML = "";
      var wrap = el("div", { class: "review" }, [el("h2", { text: "解答例と見比べる（" + exam.examName + "）" })]);
      exam.questions.forEach(function (q) {
        if (!(q.required || sel.indexOf(q.questionId) >= 0)) return;
        var tbl = el("table", null, [el("tr", null, [el("th", { text: "設問", style: "width:130px" }), el("th", { text: "あなたの解答" }), el("th", { text: "解答例" }), el("th", { text: "", style: "width:40px" })])]);
        q.subQuestions.forEach(function (sq) {
          var v = answers[sq.sub_q_id]; v = Array.isArray(v) ? v.join("，") : (v || "");
          var objective = sq.type === "選択" || sq.type === "多答";
          var ok = objective && sq.answer && norm(v) === norm(sq.answer);
          tbl.appendChild(el("tr", null, [
            el("td", { text: sq.sub_q_number }), el("td", { class: "mine", text: v || "（未解答）" }),
            el("td", null, [el("div", { class: "model", text: sq.answer || "（解答例未登録）" }), sq.note ? el("div", { class: "note", text: "※" + sq.note }) : null]),
            el("td", null, [objective && sq.answer ? el("span", { class: ok ? "auto-ok" : "auto-ng", text: ok ? "○" : "×" }) : null])
          ]));
        });
        wrap.appendChild(el("div", { class: "review-prob" }, [el("h3", { text: q.qNumber + "　" + (q.category || "") + "　" + (q.theme || "") }), tbl]));
      });
      wrap.appendChild(el("p", { style: "font-size:12px;color:#666", text: "解答例は IPA 公表の「解答例」によります。記述式は採点講評もあわせて確認してください。" }));
      wrap.appendChild(el("button", { class: "btn", text: "試験一覧へ", onclick: boot, style: "height:30px" }));
      root.appendChild(el("div", { class: "top-wrap" }, [wrap]));
    }).catch(function (err) { overlay(null); dialog("確認", String(err.message || err), null); });
  }

  boot();
})();
</script>
